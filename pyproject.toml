[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lfm-audio-service"
version = "0.1.0"
description = "Private OpenAI-compatible ASR and TTS service backed by LFM2.5-Audio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "liquid-audio>=1.2,<2",
  "numpy>=1.26,<3",
  "python-multipart>=0.0.9,<1",
  "soundfile>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
lfm-audio-service = "lfm_audio_service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
